<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Estoque — Workplace MG2</title><style>:root{--bg:#070b14;--card:#111827;--card2:#172033;--line:#29364a;--txt:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--green:#047857;--red:#991b1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Arial,sans-serif}header{padding:22px 24px;background:#050812;border-bottom:1px solid var(--line)}h1{margin:0;font-size:22px}header p{color:var(--muted);margin:7px 0 0}main{max-width:1150px;margin:22px auto;padding:0 16px}.nav,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button{border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:12px 16px;border-radius:9px;font-weight:700;cursor:pointer}.blue{background:var(--blue)}.green{background:var(--green)}.red{background:var(--red)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}h2{margin-top:0}label{display:block;margin:12px 0 6px;font-weight:700;color:#cbd5e1}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0b1220;color:var(--txt)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:var(--card2);padding:16px;border:1px solid var(--line);border-radius:10px}.stat span{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:5px}.filters{display:grid;grid-template-columns:1fr 220px;gap:10px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:#93c5fd}.muted{color:var(--muted)}.msg{display:none;margin-top:12px;padding:11px;border-radius:8px}.ok{background:#065f46}.warn{background:#7f1d1d}.badge{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:99px;background:var(--card2)}section{display:none}#stock{display:block}@media(max-width:700px){.grid,.stats,.filters{grid-template-columns:1fr}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header><h1>Controle de Estoque — Espaço Workplace MG2</h1><p>Consulta, entrada e saída pelo mesmo link • sem login</p></header><main><div class="nav"><button class="blue" onclick="show('stock')">📦 Estoque</button><button class="green" onclick="show('entry')">➕ Entrada</button><button class="red" onclick="show('exit')">➖ Saída</button></div><section id="stock"><div class="card"><h2>Estoque disponível</h2><div class="muted">Qualquer pessoa com o link pode consultar e movimentar.</div></div><div class="stats"><div class="stat"><span>Itens disponíveis</span><b id="total">0</b></div><div class="stat"><span>Tipos</span><b id="types">0</b></div><div class="stat"><span>Atualização</span><b id="updated" style="font-size:16px">—</b></div></div><div class="card"><div class="filters"><input id="search" placeholder="Pesquisar ativo, equipamento, colaborador ou chamado..." oninput="render()"><select id="filter" onchange="render()"><option value="">Todos os equipamentos</option></select></div><div id="table"></div></div></section><section id="entry"><div class="card"><h2>➕ Registrar entrada</h2><div class="grid"><div><label>Chamado</label><input id="ec"></div><div><label>Equipamento</label><select id="ee"></select></div><div><label>Ativo</label><input id="ea"></div><div><label>Colaborador</label><input id="ecol"></div><div><label>Técnico responsável</label><input id="et"></div></div><div class="actions"><button class="green" onclick="move('entrada')">Registrar entrada</button><button onclick="show('stock')">Cancelar</button></div><div id="emsg" class="msg"></div></div></section><section id="exit"><div class="card"><h2>➖ Registrar saída</h2><div class="grid"><div><label>Chamado</label><input id="sc"></div><div><label>Equipamento</label><select id="se" onchange="assets()"></select></div><div><label>Ativo</label><input id="sa" list="alist"><datalist id="alist"></datalist></div><div><label>Colaborador</label><input id="scol"></div><div><label>Técnico responsável</label><input id="st"></div></div><div class="actions"><button class="red" onclick="move('saida')">Registrar saída</button><button onclick="show('stock')">Cancelar</button></div><div id="smsg" class="msg"></div></div></section></main><script>const API='https://lozqdrqujouvjfflgasl.supabase.co/functions/v1/mg2-public';let stock=[];async function api(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Erro de comunicação');return d}async function load(){try{let d=await api(API+'?action=stock');stock=d.data||[];render();options()}catch(e){document.getElementById('table').innerHTML='<div class="muted">Não foi possível carregar o estoque: '+esc(e.message)+'</div>'}}async function options(){try{let d=await api(API+'?action=options&type=equipamento');for(const id of ['ee','se']){let s=document.getElementById(id);s.innerHTML='<option value="">Selecione...</option>';(d.data||[]).forEach(x=>s.add(new Option(x.name,x.name)))}}catch(e){}}function render(){let q=(document.getElementById('search').value||'').toLowerCase(),sel=document.getElementById('filter'),cur=sel.value,types=[...new Set(stock.map(x=>x.equipamento))].sort();sel.innerHTML='<option value="">Todos os equipamentos</option>';types.forEach(x=>sel.add(new Option(x,x)));sel.value=types.includes(cur)?cur:'';let a=stock.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!sel.value||x.equipamento===sel.value));document.getElementById('total').textContent=stock.length;document.getElementById('types').textContent=types.length;document.getElementById('updated').textContent=new Date().toLocaleTimeString('pt-BR');document.getElementById('table').innerHTML=a.length?'<table><tr><th>Equipamento</th><th>Ativo</th><th>Colaborador</th><th>Chamado</th><th>Técnico</th><th>Entrada</th></tr>'+a.map(x=>'<tr><td>'+esc(x.equipamento)+'</td><td>'+esc(x.ativo)+'</td><td>'+esc(x.colaborador)+'</td><td>'+esc(x.chamado)+'</td><td>'+esc(x.tecnico)+'</td><td>'+new Date(x.created_at).toLocaleString('pt-BR')+'</td></tr>').join('')+'</table>':'<div class="muted">Nenhum equipamento disponível.</div>'}function assets(){let eq=document.getElementById('se').value,d=document.getElementById('alist');d.innerHTML=stock.filter(x=>x.equipamento===eq).map(x=>'<option value="'+esc(x.ativo)+'">').join('')}async function move(type){let p=type==='entrada'?'e':'s',v=id=>document.getElementById(p+id).value.trim(),data={type,chamado:v('c'),equipamento:v('e'),ativo:v('a'),colaborador:v('col'),tecnico:v('t')},box=document.getElementById(type==='entrada'?'emsg':'smsg');if(Object.values(data).some(x=>!x)){msg(box,'Preencha todos os campos.','warn');return}try{await api(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});msg(box,'Movimentação registrada com sucesso.','ok');setTimeout(()=>{show('stock');load()},600)}catch(e){msg(box,e.message,'warn')}}function show(id){['stock','entry','exit'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');if(id!=='stock')options();if(id==='stock')load()}function msg(e,t,c){e.textContent=t;e.className='msg '+c;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script></body></html>
